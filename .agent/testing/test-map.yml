# Test ↔ source map (Pass 1.5)
# Hand-annotated at architectural boundaries; generated where tooling exists.
# verify.mjs maps changed files → these globs. `shared_footprint: true` widens
# the scope (L1 suite-wide) when the file is touched.
modules:
  pricing:
    source: [src/lib/pricing.ts, src/lib/pricing/**]
    unit: [tests/unit/pricing.test.ts]
    e2e_hint: [e2e/smoke.spec.ts]
    shared_footprint: true
  order-status:
    source: [src/lib/order-status.ts]
    unit: [tests/unit/order-status.test.ts]
    e2e_hint: [e2e/smoke.spec.ts]
  validations:
    source: [src/lib/validations/**]
    unit: [tests/unit/validations.test.ts]
  utils:
    source: [src/lib/utils.ts]
    unit: [tests/unit/utils.test.ts, tests/unit/dead-utilities.test.ts]
    shared_footprint: true
  motion:
    source: [src/lib/motion.ts]
    unit: [tests/unit/motion.test.ts]
  design-tokens:
    source: [src/lib/design-tokens.ts, tokens/**]
    unit: [tests/unit/design-tokens.test.ts]
    shared_footprint: true
  globals-tokens:
    source: [src/app/globals.css]
    unit: [tests/unit/globals-tokens.test.ts, tests/unit/text-contrast.test.ts, tests/unit/tailwind-opacity.test.ts]
    shared_footprint: true
  tailwind-config:
    source: [tailwind.config.ts]
    unit: [tests/unit/tailwind-opacity.test.ts, tests/unit/dead-utilities.test.ts, tests/unit/text-contrast.test.ts]
  providers:
    source: [src/components/**, src/app/layout.tsx]
    unit: [tests/unit/components/providers.test.tsx]
  auth-middleware:
    source: [src/middleware.ts, src/auth.config.ts, src/lib/auth.ts, src/lib/auth-secret.ts, src/instrumentation.ts]
    unit: [tests/unit/auth-session.test.ts, tests/unit/auth-env.test.ts]
    e2e_hint: [e2e/smoke.spec.ts]
    shared_footprint: true
  rate-limit:
    source: [src/lib/rate-limit.ts, src/app/api/auth/register/route.ts, src/app/api/auth/forgot-password/route.ts, src/app/api/auth/reset-password/route.ts, src/app/api/auth/change-password/route.ts, src/app/api/contact/route.ts]
    unit: [tests/unit/rate-limit.test.ts, tests/unit/track-order.test.ts]
  track-order:
    source: [src/lib/actions/trackOrder.ts, src/lib/validations/track-order.ts, src/app/api/orders/track/route.ts, src/app/(customer)/track-order/**]
    unit: [tests/unit/track-order.test.ts]
  api-utils-prisma:
    source: [src/lib/api-utils.ts, src/lib/prisma.ts]
    unit: []
    e2e_hint: [e2e/smoke.spec.ts]
    shared_footprint: true
  spend-tiers:
    source: [src/lib/spend-tiers.ts]
    unit: [tests/unit/spend-tiers.test.ts]
  customers:
    source: [src/lib/customers.ts, src/app/api/customers/**, src/app/(admin)/admin/customers/page.tsx]
    unit: [tests/unit/customers-api.test.ts]
  secrets:
    source: [src/lib/crypto.ts, src/lib/secret-settings.ts, src/lib/actions/settings.ts, src/lib/server/settings-backup.ts, src/lib/server/email-config.ts]
    unit: [tests/unit/crypto.test.ts, tests/unit/secret-settings.test.ts, tests/unit/secret-roundtrip.test.ts, tests/unit/settings-backup.test.ts]
    shared_footprint: true
  webhooks:
    source: [src/lib/server/webhooks.ts, src/lib/validations/webhook.ts, src/app/api/webhooks/**]
    unit: [tests/unit/webhooks.test.ts]
  api-keys:
    source: [src/lib/server/api-keys.ts, src/lib/validations/api-key.ts, src/app/api/api-keys/**, src/app/api/headless/**]
    unit: [tests/unit/api-keys.test.ts, tests/unit/api-key-scopes.test.ts]
  settings-backup:
    source: [src/lib/server/settings-backup.ts, src/app/api/settings/backup/**]
    unit: [tests/unit/settings-backup.test.ts]
  products:
    source: [src/lib/product-csv.ts, src/lib/actions/product.ts, src/app/api/products/**]
    unit: [tests/unit/product-csv.test.ts, tests/unit/dead-utilities.test.ts]
    shared_footprint: true
  custom-requests:
    source: [src/lib/actions/customRequest.ts, src/lib/validations/custom-request.ts, src/app/api/custom-requests/**]
    unit: [tests/unit/custom-request-workflow.test.ts, tests/unit/webhooks.test.ts]
  realtime:
    source: [src/lib/hooks/useAdminRealtime.ts, src/lib/socket.ts]
    unit: [tests/unit/spend-tiers.test.ts]
  admin-bootstrap:
    source: [instrumentation.ts, next.config.js, src/lib/admin-bootstrap.ts]
    unit: [tests/unit/admin-bootstrap.test.ts]
  csv:
    source: [src/lib/csv.ts, src/lib/product-csv.ts, src/app/api/products/export/route.ts, src/app/api/orders/export/route.ts, src/app/api/custom-requests/export/route.ts]
    unit: [tests/unit/csv.test.ts, tests/unit/product-csv.test.ts]
  analytics:
    source: [src/lib/analytics.ts, src/app/api/analytics/**, src/components/admin/StatsCards.tsx, src/app/(admin)/admin/analytics/page.tsx, src/app/(admin)/admin/dashboard/page.tsx]
    unit: [tests/unit/analytics-orders.test.ts]
  password-reset:
    source: [src/app/api/auth/forgot-password/route.ts, src/app/api/auth/reset-password/route.ts, 'src/app/api/auth/[...nextauth]/route.ts', src/lib/email.ts, src/app/(customer)/forgot-password/**, src/app/(customer)/reset-password/**]
    unit: [tests/unit/password-reset.test.ts, tests/unit/pages/auth-flow.test.tsx]
